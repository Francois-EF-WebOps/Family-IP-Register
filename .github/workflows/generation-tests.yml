name: Generation engine tests

on:
  push:
    paths:
      - 'scripts/generate.py'
      - 'generation/**'
      - 'tests/test_generate.py'
      - '.github/workflows/generation-tests.yml'
  pull_request:
    paths:
      - 'scripts/generate.py'
      - 'generation/**'
      - 'tests/test_generate.py'
      - '.github/workflows/generation-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: |
          python scripts/generate.py --job examples/jobs/content.example.json --output-dir /tmp/fip-generation-content
          python scripts/generate.py --job examples/jobs/digital-product.example.json --output-dir /tmp/fip-generation-product
          python scripts/generate.py --job examples/jobs/software.example.json --output-dir /tmp/fip-generation-software
          python -m py_compile /tmp/fip-generation-software/src/main.py /tmp/fip-generation-software/tests/test_main.py
